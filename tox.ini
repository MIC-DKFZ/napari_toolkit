# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{39,310,311,312}-{linux,macos,windows}-{pyqt5,pyside6}
isolated_build=true

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
extras =
    pyqt5: testing
    pyside6: testing-pyside6
setenv =
    QT_QPA_PLATFORM = offscreen
    XDG_CACHE_HOME = {toxworkdir}/cache
    XDG_CONFIG_HOME = {toxworkdir}/config
    pyqt5: QT_API = pyqt5
    pyside6: QT_API = pyside6
commands = pytest src/napari_toolkit/_tests/ -v --color=yes --cov=src/napari_toolkit --cov-report=xml --cov-report=html
